name: CI

# GitHub-hosted, deliberately.
#
# This repository is public, and a public repository must never run on the
# self-hosted fleet — that is the rule this project exists to enforce, and it
# applies to the project itself first. A public repository accepts pull
# requests from anyone, a pull request is a proposal to run its author's code,
# and a self-hosted runner is a persistent machine that is not reset between
# jobs. See docs/RUNNER_FLEET.md.
#
# Being hosted is also why this workflow can use an ordinary `pull_request`
# trigger with no fork gate: a fork's code running on a throwaway GitHub VM is
# exactly what that VM is for.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # macos-26, not macos-15. The package is swift-tools-version 6.0 and is
    # developed against Swift 6.3 / macOS 26; on the older image's toolchain
    # the test suite fails to compile on main-actor isolation rules that
    # Swift 6.3 resolves differently. Running CI on a toolchain the project
    # does not target tests the wrong thing.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run unit tests
        run: ./run-tests.sh

      - name: Build release configuration
        run: swift build -c release

      - name: Shellcheck the runner scripts
        # These scripts provision and audit real hosts; a typo in one is a
        # worse outcome than a typo in the app.
        run: |
          set -euo pipefail
          brew install shellcheck >/dev/null
          shellcheck -s bash scripts/*.sh
